name: Build Forge Mod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: magenta-lightsaber
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Magenta Lightsaber ${{ github.ref_name }}
          body: |
            Sable de luz para **Minecraft 1.21.1 + Forge 52.x**.

            ### Uso
            - **Click derecho** para encender o apagar la hoja magenta.
            - Espada potente cuando está encendida: +8 de daño y velocidad de espada.
            - Partículas y sonido al encender.

            ### Receta
            2 lingotes de oro, 3 lingotes de hierro, 1 lingote de netherite y 1 tinte magenta.

            ### Instalación
            Coloca el jar en `.minecraft/mods` con Forge 1.21.1 y Java 21.
          files: build/libs/*.jar
          generate_release_notes: true
